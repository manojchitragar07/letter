<svg viewBox="0 0 150 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Perforated Stamp Edge -->
  <rect x="4" y="4" width="142" height="112" fill="#F4EDE2" stroke="#BFAFA0" stroke-width="1.8" stroke-dasharray="4 4"/>
  <!-- Inner Border Frame -->
  <rect x="10" y="10" width="130" height="100" fill="#FCFAF6" stroke="#2B466B" stroke-width="1.5"/>
  <!-- Top Banner -->
  <text x="75" y="26" text-anchor="middle" fill="#2B466B" font-size="8.5" font-family="Georgia, serif" font-weight="bold" letter-spacing="2">
    MESSAGERIE POSTALE
  </text>
  <!-- Flying Swallow with Envelope -->
  <g transform="translate(25, 20)">
    <!-- Swallow Wings and Body -->
    <path d="M35 55 C 50 42 75 40 90 50 C 98 32 118 22 138 18 C 128 38 112 52 98 60 C 92 76 78 90 55 86 C 45 82 38 75 35 55 Z" fill="#2B466B"/>
    <path d="M80 47 C 70 24 55 14 45 12 C 50 28 65 42 75 54 Z" fill="#1B2F4A"/>
    <!-- Envelope in Beak -->
    <rect x="18" y="58" width="18" height="12" fill="#FAF6EE" stroke="#C23B4E" stroke-width="1" transform="rotate(-15 18 58)"/>
    <path d="M18 58 L27 64 L36 58" stroke="#C23B4E" stroke-width="0.8" transform="rotate(-15 18 58)"/>
  </g>
  <!-- Denomination -->
  <text x="24" y="98" fill="#2B466B" font-size="13" font-family="Georgia, serif" font-weight="bold">
    50¢
  </text>
  <text x="126" y="98" text-anchor="end" fill="#2B466B" font-size="8.5" font-family="Georgia, serif">
    EXPRESS
  </text>
</svg>
