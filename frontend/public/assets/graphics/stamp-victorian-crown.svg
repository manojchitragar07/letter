<svg viewBox="0 0 130 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Perforated Stamp Edge -->
  <rect x="4" y="4" width="122" height="152" fill="#EAE2D2" stroke="#B8A992" stroke-width="1.8" stroke-dasharray="4 4"/>
  <!-- Inner Ornate Royal Frame -->
  <rect x="10" y="10" width="110" height="140" fill="#24334A" stroke="#C5A059" stroke-width="1.8"/>
  <rect x="14" y="14" width="102" height="132" stroke="#C5A059" stroke-width="0.8" stroke-dasharray="2 3"/>
  <!-- Royal Banner -->
  <text x="65" y="30" text-anchor="middle" fill="#C5A059" font-size="8.5" font-family="Georgia, serif" font-weight="bold" letter-spacing="2">
    ROYAL POSTAGE
  </text>
  <!-- Victorian Crown Emblem -->
  <g transform="translate(65, 75)">
    <path d="M-28 15 H28 V20 H-28 Z" fill="#E5C378"/>
    <circle cx="-20" cy="17.5" r="1.5" fill="#C5A059"/>
    <circle cx="0" cy="17.5" r="1.5" fill="#C5A059"/>
    <circle cx="20" cy="17.5" r="1.5" fill="#C5A059"/>
    <!-- Crown Peaks -->
    <path d="M-28 15 L-24 -8 L-12 5 L0 -14 L12 5 L24 -8 L28 15 Z" fill="#E5C378" stroke="#9A7528" stroke-width="1"/>
    <!-- Jewels on Crown Peaks -->
    <circle cx="-24" cy="-8" r="3" fill="#D94B5C"/>
    <circle cx="0" cy="-14" r="3.5" fill="#4B8CD9"/>
    <circle cx="24" cy="-8" r="3" fill="#D94B5C"/>
  </g>
  <!-- Denomination -->
  <text x="65" y="130" text-anchor="middle" fill="#E5C378" font-size="13" font-family="Georgia, serif" font-weight="bold" letter-spacing="1">
    FIVE PENCE
  </text>
</svg>
